<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Basketball '79</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{display:flex;flex-direction:column;height:100%;color:#ff3b1f;}
  #hud{display:flex;justify-content:space-between;padding:8px 14px;font-size:4.6vw;text-shadow:0 0 8px #ff3b1f;letter-spacing:1px;flex-shrink:0;}
  #hud span{white-space:nowrap;}
  #court{flex:1;position:relative;background:#050200;border-top:2px solid #330d00;border-bottom:2px solid #330d00;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:7.5vw;color:#ff3b1f;text-shadow:0 0 16px #ff3b1f;text-align:center;display:none;z-index:5;white-space:pre-line;line-height:1.3;}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;background:#050200;}
  #title h2{font-size:8vw;text-shadow:0 0 14px #ff3b1f;margin:0 0 3vh;letter-spacing:2px;}
  #title .blink{font-size:4.5vw;animation:blink 1s step-start infinite;}
  #title .hi{margin-top:4vh;font-size:4vw;color:#ffd400;text-shadow:0 0 10px #ffd400;}
  @keyframes blink{50%{opacity:0;}}
  #controls{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
  .dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:4px;}
  .dpad button{background:#140000;border:2px solid #ff3b1f;color:#ff3b1f;font-size:20px;border-radius:8px;}
  .dpad button:active{background:#ff3b1f;color:#000;}
  #up{grid-column:2;grid-row:1;} #left{grid-column:1;grid-row:2;} #right{grid-column:3;grid-row:2;} #down{grid-column:2;grid-row:3;}
  #actionBtns{display:flex;flex-direction:column;gap:8px;}
  #actionBtns button{width:86px;height:42px;background:#140000;border:3px solid #ff3b1f;color:#ff3b1f;border-radius:10px;font-weight:bold;font-size:12px;}
  #actionBtns button:active{background:#ff3b1f;color:#000;}
  #topbar{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:10;}
  #back{color:#883;text-decoration:none;font-size:4vw;}
  #mute{background:none;border:none;color:#883;font-size:4.5vw;}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a href="../index.html" id="back">‹ MENU</a>
    <button id="mute">🔊</button>
  </div>
  <div id="hud">
    <span id="score">YOU 00</span>
    <span id="clock">24</span>
    <span id="gameclock">1:30</span>
    <span id="cpuscore">CPU 00</span>
  </div>
  <div id="court">
    <canvas id="c"></canvas>
    <div id="msg"></div>
    <div id="title">
      <h2>🏀 BASKETBALL '79</h2>
      <div class="blink">TAP START TO PLAY</div>
      <div class="hi" id="hiscore">HI 00</div>
    </div>
  </div>
  <div id="controls">
    <div class="dpad">
      <button id="up">▲</button>
      <button id="left">◄</button>
      <button id="right">►</button>
      <button id="down">▼</button>
    </div>
    <div id="actionBtns">
      <button id="shoot">SHOOT</button>
      <button id="start">START</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const court = document.getElementById('court');
function resize(){ canvas.width = court.clientWidth; canvas.height = court.clientHeight; }
window.addEventListener('resize', resize); resize();

let actx, muted = false;
function beep(freq, dur, type='square'){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
document.getElementById('mute').addEventListener('click', ()=>{
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
});

const HI_KEY = 'retro_basketball_hi';
let hiscore = parseInt(localStorage.getItem(HI_KEY) || '0', 10);
document.getElementById('hiscore').textContent = 'HI ' + String(hiscore).padStart(2,'0');
function saveHi(){ if(score > hiscore){ hiscore = score; localStorage.setItem(HI_KEY, String(hiscore)); } }

// Court is horizontal: x 0..1 (left=own side, right=hoop side), y 0..1 (lane position)
let px = 0.25, py = 0.5;
let bx=null, by=null, ballFlying=false;
let haveBall = true;
let defenders = [{x:0.55,y:0.4},{x:0.6,y:0.65}];
let score=0, cpu=0, clock=24, gameTime=90, running=false, gameOver=true;
let hoopX=0.92, hoopY=0.5;
let clockTimer=null;
let level=0, defSpeed=0.01;

function updateHud(){
  document.getElementById('score').textContent = 'YOU ' + String(score).padStart(2,'0');
  document.getElementById('cpuscore').textContent = 'CPU ' + String(cpu).padStart(2,'0');
  document.getElementById('clock').textContent = String(clock).padStart(2,'0');
  const mm = Math.floor(gameTime/60), ss = String(gameTime%60).padStart(2,'0');
  document.getElementById('gameclock').textContent = mm+':'+ss;
}
function showMsg(text, ms){
  const m = document.getElementById('msg');
  m.textContent = text; m.style.display='block';
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=>{ m.style.display='none'; }, ms||1200);
}

function resetPossession(toPlayer){
  px = toPlayer? 0.18 : 0.8; py = 0.5;
  haveBall = toPlayer;
  ballFlying = false; bx=null; by=null;
  clock = 24;
  defenders = [
    {x:0.5+Math.random()*0.15, y:0.3+Math.random()*0.2},
    {x:0.55+Math.random()*0.15, y:0.55+Math.random()*0.25}
  ];
  if(!toPlayer && !gameOver){
    setTimeout(cpuTurn, 1200);
  }
}

function cpuTurn(){
  if(gameOver) return;
  const make = Math.random() < Math.max(0.25, 0.45 - level*0.02);
  showMsg(make? 'CPU SCORES' : 'CPU MISS', 900);
  beep(make?300:150, 0.2, 'sawtooth');
  if(make) cpu += 2;
  updateHud();
  setTimeout(()=>{ if(!gameOver) resetPossession(true); }, 900);
}

function endGame(){
  gameOver = true; running = false;
  clearInterval(clockTimer);
  saveHi();
  const result = score > cpu ? 'YOU WIN!' : (score < cpu ? 'CPU WINS' : 'TIE GAME');
  showMsg('GAME OVER\\n'+result+'\\n'+score+' - '+cpu, 4000);
  setTimeout(()=>{ document.getElementById('title').style.display='flex'; document.getElementById('hiscore').textContent='HI '+String(hiscore).padStart(2,'0'); }, 1600);
}

function startGame(){
  document.getElementById('title').style.display='none';
  score=0; cpu=0; clock=24; gameTime=90; level=0; defSpeed=0.01; gameOver=false;
  updateHud();
  resetPossession(true);
  running = true;
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(()=>{
    if(!running || gameOver) return;
    clock--;
    gameTime--;
    if(gameTime<=0){ endGame(); return; }
    if(clock<=0){
      clock = 24;
      if(haveBall && !ballFlying){
        showMsg('SHOT CLOCK!', 900);
        beep(100,0.3,'sawtooth');
        vibrate(50);
        setTimeout(()=>{ if(!gameOver) resetPossession(false); }, 900);
      }
    }
    updateHud();
  }, 1000);
}

function move(dx,dy){
  if(!haveBall || ballFlying || gameOver) return;
  px = Math.max(0.05, Math.min(0.85, px+dx));
  py = Math.max(0.08, Math.min(0.92, py+dy));
}

function shoot(){
  if(!haveBall || ballFlying || gameOver) return;
  const dist = Math.hypot(hoopX-px, hoopY-py);
  let nearestDef = Math.min(...defenders.map(d=>Math.hypot(d.x-px,d.y-py)));
  let baseChance = Math.max(0.15, 0.9 - dist*0.9);
  if(nearestDef < 0.12) baseChance *= 0.4;
  const make = Math.random() < baseChance;
  ballFlying = true; haveBall = false;
  bx = px; by = py;
  beep(600,0.08);
  const startX=px, startY=py;
  const flightFrames = 30;
  let frame = 0;
  const anim = setInterval(()=>{
    frame++;
    const t = frame/flightFrames;
    bx = startX + (hoopX-startX)*t;
    by = startY + (hoopY-startY)*t - Math.sin(t*Math.PI)*0.15;
    if(frame>=flightFrames){
      clearInterval(anim);
      ballFlying = false;
      if(make){
        score += 2;
        level++;
        beep(900,0.15); setTimeout(()=>beep(1300,0.2),120);
        vibrate([40,30,80]);
        showMsg('SWISH!\\n+2', 1100);
      } else {
        beep(200,0.2,'sawtooth');
        showMsg('MISS', 900);
      }
      updateHud();
      setTimeout(()=>{ if(!gameOver) resetPossession(false); }, 900);
    }
  }, 16);
}

document.getElementById('left').addEventListener('touchstart', e=>{e.preventDefault(); move(-0.06,0);});
document.getElementById('right').addEventListener('touchstart', e=>{e.preventDefault(); move(0.06,0);});
document.getElementById('up').addEventListener('touchstart', e=>{e.preventDefault(); move(0,-0.06);});
document.getElementById('down').addEventListener('touchstart', e=>{e.preventDefault(); move(0,0.06);});
document.getElementById('left').addEventListener('mousedown', ()=>move(-0.06,0));
document.getElementById('right').addEventListener('mousedown', ()=>move(0.06,0));
document.getElementById('up').addEventListener('mousedown', ()=>move(0,-0.06));
document.getElementById('down').addEventListener('mousedown', ()=>move(0,0.06));
document.getElementById('shoot').addEventListener('click', shoot);
document.getElementById('start').addEventListener('click', startGame);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') move(-0.06,0);
  if(e.key==='ArrowRight') move(0.06,0);
  if(e.key==='ArrowUp') move(0,-0.06);
  if(e.key==='ArrowDown') move(0,0.06);
  if(e.key===' ') shoot();
});

updateHud();

function drawDotGrid(w,h){
  ctx.fillStyle = 'rgba(255,59,31,0.035)';
  const step = 14;
  for(let x=step/2; x<w; x+=step){
    for(let y=step/2; y<h; y+=step){
      ctx.fillRect(x-1,y-1,2,2);
    }
  }
}

function loop(){
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle='#050200'; ctx.fillRect(0,0,w,h);
  drawDotGrid(w,h);

  ctx.strokeStyle='rgba(255,59,31,0.15)'; ctx.lineWidth=2;
  ctx.strokeRect(w*0.03,h*0.06,w*0.94,h*0.88);
  ctx.beginPath(); ctx.arc(w*hoopX,h*hoopY,w*0.1,0,Math.PI*2); ctx.stroke();

  if(haveBall && !ballFlying && !gameOver){
    const speedMul = defSpeed + level*0.0015;
    for(const d of defenders){
      d.x += (px - d.x) * speedMul * (Math.random()<0.5?1:0.4);
      d.y += (py - d.y) * speedMul * (Math.random()<0.5?1:0.4);
    }
  }

  ctx.shadowColor='#ff3b1f'; ctx.shadowBlur=14;
  ctx.fillStyle='#ff3b1f';
  ctx.fillRect(w*hoopX-6, h*hoopY-24, 12, 48);

  for(const d of defenders){
    ctx.shadowBlur=10; ctx.fillStyle='#ff3b1f';
    ctx.fillRect(w*d.x-9, h*d.y-9, 18, 18);
  }

  ctx.shadowBlur=18; ctx.fillStyle='#ffd400';
  ctx.fillRect(w*px-10, h*py-10, 20, 20);

  if(ballFlying && bx!==null){
    ctx.shadowBlur=14; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(w*bx, h*by, 7, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
