<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Retro Handheld Arcade</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Courier New',monospace;}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#ff3b1f;}
  h1{font-size:7vw;letter-spacing:2px;text-shadow:0 0 10px #ff3b1f,0 0 20px #ff3b1f;margin-bottom:4vh;text-align:center;}
  .menu{display:flex;flex-direction:column;gap:20px;width:80vw;max-width:420px;}
  a.btn{display:block;text-align:center;padding:18px 22px 10px;border:3px solid #ff3b1f;border-radius:10px;color:#ff3b1f;text-decoration:none;font-size:5vw;font-weight:bold;letter-spacing:3px;box-shadow:0 0 14px rgba(255,59,31,0.6) inset;background:#140000;}
  a.btn:active{background:#ff3b1f;color:#000;}
  .hiline{display:block;margin-top:8px;font-size:3.2vw;color:#ffd400;letter-spacing:1px;text-shadow:0 0 6px #ffd400;font-weight:normal;}
  .sub{margin-top:6vh;font-size:3vw;color:#883;opacity:0.7;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ RETRO<br>HANDHELD ⚡</h1>
  <div class="menu">
    <a class="btn" href="football/index.html">🏈 FOOTBALL '78<span class="hiline" id="hiF">HI 00</span></a>
    <a class="btn" href="basketball/index.html">🏀 BASKETBALL '79<span class="hiline" id="hiB">HI 00</span></a>
  </div>
  <div class="sub">Tap Share → Add to Home Screen<br>for full screen play</div>
</div>
<script>
  document.getElementById('hiF').textContent = 'HI ' + String(parseInt(localStorage.getItem('retro_football_hi')||'0',10)).padStart(2,'0');
  document.getElementById('hiB').textContent = 'HI ' + String(parseInt(localStorage.getItem('retro_basketball_hi')||'0',10)).padStart(2,'0');
</script>
</body>
</html>
