<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gridiron Football</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2e16">
<style>
  html,body{margin:0;padding:0;background:#0b2e16;height:100%;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{display:flex;flex-direction:column;height:100%;color:#e8e8e8;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-size:3.3vw;background:linear-gradient(#1a1a1a,#0a0a0a);border-bottom:3px solid #444;flex-shrink:0;letter-spacing:0.5px;}
  #hud span{white-space:nowrap;}
  #hud .you{color:#fff;background:#1557b0;padding:3px 7px;border-radius:4px;font-weight:bold;}
  #hud .cpu{color:#fff;background:#b01515;padding:3px 7px;border-radius:4px;font-weight:bold;}
  #hud .mid{color:#ffd400;font-weight:bold;}
  #field{flex:1;position:relative;background:#0b2e16;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:6.5vw;color:#fff;text-shadow:0 0 10px #000,0 0 4px #000;text-align:center;display:none;z-index:6;white-space:pre-line;line-height:1.25;font-weight:bold;}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;background:#0b2e16;}
  #title h2{font-size:7vw;text-shadow:0 0 14px #2f7;margin:0 0 1vh;letter-spacing:1px;color:#5f5;text-align:center;}
  #title .sub2{font-size:3.3vw;color:#9c9;margin-bottom:3vh;text-align:center;max-width:80vw;}
  #title .blink{font-size:4.2vw;animation:blink 1s step-start infinite;color:#fff;}
  #title .hi{margin-top:4vh;font-size:3.8vw;color:#ffd400;text-shadow:0 0 10px #ffd400;}
  @keyframes blink{50%{opacity:0;}}
  #playmenu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:8;background:rgba(6,20,10,0.95);gap:12px;}
  #playmenu h3{color:#5f5;font-size:5vw;margin:0 0 2vh;letter-spacing:1px;}
  #playmenu button{width:70vw;max-width:340px;padding:14px;background:#0a0a0a;border:2px solid #5f5;color:#dfd;font-size:4.2vw;border-radius:8px;font-weight:bold;}
  #playmenu button:active{background:#5f5;color:#000;}
  #controls{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#0a0a0a;}
  #stickBase{width:110px;height:110px;border-radius:50%;background:#1a1a1a;border:2px solid #5f5;position:relative;}
  #stickKnob{width:50px;height:50px;border-radius:50%;background:#2a2a2a;border:2px solid #9f9;position:absolute;left:30px;top:30px;}
  #actionBtns{display:flex;flex-direction:column;gap:8px;align-items:center;}
  #actionBtns button{width:92px;height:42px;background:#1a1a1a;border:3px solid #5f5;color:#dfd;border-radius:10px;font-weight:bold;font-size:12px;}
  #actionBtns button:active{background:#5f5;color:#000;}
  #topbar{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:10;}
  #back{color:#9c9;text-decoration:none;font-size:3.8vw;}
  #mute{background:none;border:none;color:#9c9;font-size:4.2vw;}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a href="../index.html" id="back">‹ MENU</a>
    <button id="mute">🔊</button>
  </div>
  <div id="hud">
    <span class="you" id="scoreYou">YOU 00</span>
    <span class="mid" id="down">1ST &amp; 10</span>
    <span class="mid" id="ballOn">OWN 20</span>
    <span id="qtr">Q1 3:00</span>
    <span class="cpu" id="scoreCpu">CPU 00</span>
  </div>
  <div id="field">
    <canvas id="c"></canvas>
    <div id="msg"></div>
    <div id="title">
      <h2>🏈 GRIDIRON<br>FOOTBALL</h2>
      <div class="sub2">Free movement · real blocking · smart defense<br>Use the stick to juke, not lanes.</div>
      <div class="blink">TAP START</div>
      <div class="hi" id="hiscore">BEST SCORE 00</div>
    </div>
    <div id="playmenu">
      <h3>CALL YOUR PLAY</h3>
      <button data-play="run">🏃 RUN</button>
      <button data-play="short">🎯 SHORT PASS</button>
      <button data-play="long">🚀 LONG BOMB</button>
    </div>
  </div>
  <div id="controls">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div id="actionBtns">
      <button id="throw">THROW</button>
      <button id="juke">JUKE</button>
      <button id="start">START</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const field = document.getElementById('field');
function resize(){ canvas.width = field.clientWidth; canvas.height = field.clientHeight; }
window.addEventListener('resize', resize); resize();

// ===== Audio =====
let actx, muted = false;
function beep(freq, dur, type='square', vol=0.08){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
document.getElementById('mute').addEventListener('click', ()=>{
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
});

// ===== High score =====
const HI_KEY = 'retro_madden_hi';
let hiscore = parseInt(localStorage.getItem(HI_KEY) || '0', 10);
document.getElementById('hiscore').textContent = 'BEST SCORE ' + String(hiscore).padStart(2,'0');
function saveHi(){ if(scoreYou > hiscore){ hiscore = scoreYou; localStorage.setItem(HI_KEY, String(hiscore)); } }

// ===== Virtual joystick (free analog movement) =====
let joy = {x:0, y:0, active:false};
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
let stickId = null;
function stickVecFromEvent(touch){
  const rect = stickBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = touch.clientX - cx, dy = touch.clientY - cy;
  const max = rect.width/2;
  const mag = Math.hypot(dx,dy);
  if(mag > max){ dx = dx/mag*max; dy = dy/mag*max; }
  stickKnob.style.left = (30 + dx*0.5) + 'px';
  stickKnob.style.top = (30 + dy*0.5) + 'px';
  joy.x = dx/max; joy.y = dy/max; joy.active = true;
}
function stickReset(){
  joy.x = 0; joy.y = 0; joy.active = false;
  stickKnob.style.left = '30px'; stickKnob.style.top = '30px';
}
stickBase.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; stickId=t.identifier; stickVecFromEvent(t); });
stickBase.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){ if(t.identifier===stickId) stickVecFromEvent(t); }
});
stickBase.addEventListener('touchend', e=>{ e.preventDefault(); stickReset(); stickId=null; });
stickBase.addEventListener('touchcancel', ()=>{ stickReset(); stickId=null; });
let mouseDown=false;
stickBase.addEventListener('mousedown', e=>{ mouseDown=true; stickVecFromEvent(e); });
window.addEventListener('mousemove', e=>{ if(mouseDown) stickVecFromEvent(e); });
window.addEventListener('mouseup', ()=>{ if(mouseDown){ mouseDown=false; stickReset(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') joy.x=-1;
  if(e.key==='ArrowRight') joy.x=1;
  if(e.key==='ArrowUp') joy.y=-1;
  if(e.key==='ArrowDown') joy.y=1;
  if(e.key===' ') throwBall();
  if(e.key==='j') juke();
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') joy.x=0;
  if(e.key==='ArrowUp'||e.key==='ArrowDown') joy.y=0;
});

// ===== Game state =====
// Continuous field coordinates: x in [0,1] (sideline to sideline), y in [0,1] per-play depth.
// y=0 is the scoring goal for whichever team has the ball this play, y=1 is their own backfield.
let ballOn = 20;
let downNum = 1, yardsToGo = 10;
let scoreYou = 0, scoreCpu = 0;
let quarter = 1, qTimeMs = 3*60*1000;
let lastTick = 0;
let possession = 'user';
let phase = 'idle';
let gameOver = true;
let playType = null;
let controlledByUser = true;
let defenders = [];
let blockers = [];
let carrier = {x:0.5, y:0.78, vx:0, vy:0};
let qb = {x:0.5, y:0.78};
let receivers = [];
let passTimer = 0, passWindowMs = 2400;
let ballFlight = null;
let level = 0;
let screenShake = 0;
let cpuAimX = 0.5;

const MAXSPD = 0.00052;
const ACCEL = 0.0000042;
const FRICTION = 0.90;

function fmtClock(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60), r = String(s%60).padStart(2,'0');
  return m+':'+r;
}
function fieldSideText(yd){
  if(yd === 50) return 'MIDFIELD';
  if(yd < 50) return 'OWN ' + yd;
  return 'OPP ' + (100-yd);
}
function updateHud(){
  document.getElementById('scoreYou').textContent = 'YOU ' + String(scoreYou).padStart(2,'0');
  document.getElementById('scoreCpu').textContent = 'CPU ' + String(scoreCpu).padStart(2,'0');
  document.getElementById('down').textContent = ordinal(downNum) + ' & ' + yardsToGo;
  document.getElementById('ballOn').textContent = fieldSideText(ballOn);
  document.getElementById('qtr').textContent = 'Q' + quarter + ' ' + fmtClock(qTimeMs);
}
function ordinal(n){ return ['','1ST','2ND','3RD','4TH'][n] || (n+'TH'); }

function showMsg(text, ms){
  const m = document.getElementById('msg');
  m.textContent = text; m.style.display = 'block';
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=>{ m.style.display='none'; }, ms || 1300);
}

function startGame(){
  document.getElementById('title').style.display = 'none';
  scoreYou=0; scoreCpu=0; quarter=1; qTimeMs=3*60*1000; level=0; gameOver=false;
  possession='user'; ballOn=20; downNum=1; yardsToGo=10;
  updateHud();
  lastTick = Date.now();
  beginPossessionSeries();
}

function beginPossessionSeries(){
  if(possession === 'user'){
    openPlayMenu();
  } else {
    setTimeout(()=>{ if(!gameOver) cpuCallPlay(); }, 700);
  }
}

function openPlayMenu(){
  if(gameOver) return;
  phase = 'playmenu';
  document.getElementById('playmenu').style.display = 'flex';
}

document.querySelectorAll('#playmenu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.getElementById('playmenu').style.display='none';
    startPlay(btn.dataset.play, true);
  });
});

function cpuCallPlay(){
  if(gameOver) return;
  const r = Math.random();
  const type = r < 0.55 ? 'run' : (r < 0.85 ? 'short' : 'long');
  startPlay(type, false);
}

function setupDefense(play, isUserOffense){
  defenders = [];
  const n = 5 + Math.min(3, level);
  for(let i=0;i<n;i++){
    defenders.push({
      x: Math.random(),
      y: play==='run' ? (0.05+Math.random()*0.3) : (0.08+Math.random()*0.55),
      vx:0, vy:0,
      speed: (isUserOffense ? 1 : 0.86) * (MAXSPD*0.82 + Math.random()*MAXSPD*0.16 + level*MAXSPD*0.03)
    });
  }
}

function setupBlockers(){
  blockers = [];
  for(let i=-2;i<=2;i++){
    blockers.push({x: 0.5 + i*0.085, y: 0.8, engagedUntil:0});
  }
}

function startPlay(type, byUser){
  if(gameOver) return;
  playType = type;
  controlledByUser = byUser;
  setupDefense(type, byUser);
  setupBlockers();
  carrier = {x:0.5, y:0.78, vx:0, vy:0};
  qb = {x:0.5, y:0.78};
  cpuAimX = 0.2 + Math.random()*0.6;
  ballFlight = null;
  showMsg((byUser?'':'CPU ') + (type==='run' ? 'HANDOFF!' : (type==='short' ? 'SHORT PASS' : 'GOING DEEP!')), 650);

  if(type === 'run'){
    phase = 'live-run';
  } else {
    phase = 'live-pass';
    passTimer = 0;
    receivers = type==='short'
      ? [{x:0.18, y:0.6},{x:0.82, y:0.6},{x:0.5, y:0.48}]
      : [{x:0.18, y:0.12},{x:0.82, y:0.12},{x:0.5, y:0.22}];
    if(!byUser){
      setTimeout(()=>{ if(!gameOver && phase==='live-pass' && !controlledByUser) autoThrowCpu(); }, 900+Math.random()*700);
    }
  }
}

function juke(){
  if(gameOver || phase!=='live-run' || !controlledByUser) return;
  beep(500,0.06);
  vibrate(20);
  for(const d of defenders){
    const dist = Math.hypot(d.x-carrier.x, d.y-carrier.y);
    if(dist < 0.14){ d.y += 0.045; screenShake = Math.max(screenShake, 4); }
  }
}

function throwBall(){
  if(gameOver || phase!=='live-pass' || !controlledByUser || ballFlight) return;
  doThrow(qb);
}
function autoThrowCpu(){
  if(gameOver || phase!=='live-pass') return;
  doThrow(qb);
}
function doThrow(fromPos){
  let best=null, bestOpen=-1;
  for(const r of receivers){
    const nearestDef = Math.min(...defenders.map(d=>Math.hypot(d.x-r.x, (d.y-r.y))));
    if(nearestDef > bestOpen){ bestOpen = nearestDef; best = r; }
  }
  beep(650,0.08);
  ballFlight = {fromX:fromPos.x, fromY:fromPos.y, toX:best.x, toY:best.y, t:0, dur:26, openness:bestOpen};
  phase = 'ball-flight';
}

document.getElementById('throw').addEventListener('click', throwBall);
document.getElementById('juke').addEventListener('click', juke);
document.getElementById('start').addEventListener('click', startGame);

function applyGain(yards, isUser){
  if(isUser){
    ballOn = Math.max(0, Math.min(100, ballOn + yards));
    yardsToGo -= yards;
    if(ballOn >= 100){ scoreTouchdown(true); return; }
    if(yardsToGo <= 0){ downNum = 1; yardsToGo = 10; showMsg('1ST DOWN!', 1000); }
    else {
      downNum++;
      if(downNum > 4){ showMsg('TURNOVER\nON DOWNS', 1300); turnPossession(); return; }
    }
    updateHud();
    setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1300);
  } else {
    ballOn = Math.max(0, Math.min(100, ballOn - yards));
    if(ballOn <= 0){ scoreTouchdown(false); return; }
    yardsToGo -= yards;
    if(yardsToGo <= 0){ downNum=1; yardsToGo=10; }
    else {
      downNum++;
      if(downNum>4){
        showMsg('CPU TURNS IT OVER\nON DOWNS', 1300);
        ballOn = 100-ballOn; downNum=1; yardsToGo=10; possession='user';
        updateHud();
        setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1300);
        return;
      }
    }
    updateHud();
    setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1300);
  }
}

function scoreTouchdown(isUser){
  if(isUser){
    scoreYou += 7; level++;
    beep(880,0.15); setTimeout(()=>beep(1200,0.25),150);
    vibrate([40,30,80]); screenShake = 10;
    showMsg('TOUCHDOWN!\n+7', 1500);
  } else {
    scoreCpu += 7;
    beep(200,0.3,'sawtooth');
    showMsg('CPU TOUCHDOWN', 1500);
  }
  ballOn = 20; downNum = 1; yardsToGo = 10;
  possession = isUser ? 'cpu' : 'user';
  updateHud();
  setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1500);
}

function turnPossession(){
  ballOn = 100 - ballOn; downNum = 1; yardsToGo = 10;
  possession = possession === 'user' ? 'cpu' : 'user';
  updateHud();
  setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1300);
}

function tackledFor(yardsGained, isUser){
  beep(130,0.25,'sawtooth'); vibrate(50); screenShake = 6;
  showMsg(yardsGained>0 ? ('GAIN OF '+yardsGained) : (yardsGained<0 ? ('LOSS OF '+(-yardsGained)) : 'NO GAIN'), 1000);
  applyGain(yardsGained, isUser);
}

function sacked(isUser){
  beep(110,0.3,'sawtooth'); vibrate(60); screenShake=5;
  showMsg('SACKED!\nLOSS OF 6', 1200);
  applyGain(-6, isUser);
}

function incomplete(intercepted, isUser){
  if(intercepted){
    beep(140,0.35,'sawtooth'); vibrate(100); screenShake=8;
    showMsg('INTERCEPTED!', 1400);
    downNum=1; yardsToGo=10;
    if(isUser) turnPossession();
    else { possession='user'; ballOn=100-ballOn; updateHud(); setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); },1300); }
  } else {
    beep(220,0.2,'sawtooth');
    showMsg('INCOMPLETE', 900);
    downNum++;
    if(downNum>4){
      showMsg('TURNOVER\nON DOWNS', 1300);
      if(isUser) turnPossession();
      else { possession='user'; ballOn=100-ballOn; downNum=1; yardsToGo=10; updateHud(); setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); },1300); }
    } else {
      updateHud();
      setTimeout(()=>{ if(!gameOver) beginPossessionSeries(); }, 1100);
    }
  }
}

function completePass(yardsGain, isUser){
  beep(750,0.12); setTimeout(()=>beep(1000,0.15),100);
  showMsg('COMPLETE!\n+'+yardsGain, 1100);
  applyGain(yardsGain, isUser);
}

function tickClock(){
  const now = Date.now();
  const dt = now - lastTick;
  lastTick = now;
  if(gameOver) return;
  qTimeMs -= dt;
  if(qTimeMs <= 0){
    quarter++;
    if(quarter > 4){ endGame(); return; }
    qTimeMs = 3*60*1000;
    showMsg('END OF QUARTER\nQ'+quarter, 1300);
  }
  updateHud();
}
setInterval(tickClock, 500);

function endGame(){
  gameOver = true;
  saveHi();
  const result = scoreYou>scoreCpu ? 'YOU WIN!' : (scoreYou<scoreCpu ? 'YOU LOSE' : 'TIE GAME');
  showMsg('FINAL\n'+result+'\n'+scoreYou+' - '+scoreCpu, 4500);
  document.getElementById('playmenu').style.display='none';
  setTimeout(()=>{
    document.getElementById('title').style.display='flex';
    document.getElementById('hiscore').textContent = 'BEST SCORE ' + String(hiscore).padStart(2,'0');
  }, 2200);
}

updateHud();

function perspScale(depth){ return 0.68 + depth*0.55; }

function drawField(w,h){
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0f4a24'); g.addColorStop(0.5,'#126b2d'); g.addColorStop(1,'#0c3b1c');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){ if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.035)'; ctx.fillRect(0,h*i/10,w,h/10); } }
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=2;
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.font='bold '+Math.round(w*0.045)+'px Courier New'; ctx.textAlign='center';
  const yardMarks=['','OPP 40','OPP 30','OPP 20','OPP 10','50','OWN 10','OWN 20','OWN 30','OWN 40',''];
  for(let i=1;i<10;i++){
    const y=h*i/10;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    ctx.fillRect(w*0.22-1,y-6,2,12); ctx.fillRect(w*0.78-1,y-6,2,12);
    if(yardMarks[i]) ctx.fillText(yardMarks[i], w/2, y-6);
  }
  ctx.fillStyle = 'rgba(21,87,176,0.45)'; ctx.fillRect(0,0,w,h*0.06);
  ctx.fillStyle = 'rgba(176,21,21,0.45)'; ctx.fillRect(0,h*0.94,w,h*0.06);
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.font='bold '+Math.round(w*0.03)+'px Courier New';
  ctx.translate(w*0.5,h*0.03); ctx.fillText('END ZONE',0,0);
  ctx.translate(0,h*0.91); ctx.fillText('END ZONE',0,0);
  ctx.restore();
  const vg = ctx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,h*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
}

function drawPlayer(cx,cy,scale,jerseyColor,helmetColor,number,facingUp){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx,cy+9*scale,11*scale,4*scale,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#eee';
  ctx.fillRect(cx-6*scale,cy+2*scale,4*scale,8*scale);
  ctx.fillRect(cx+2*scale,cy+2*scale,4*scale,8*scale);
  ctx.fillStyle=jerseyColor;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(cx-9*scale,cy-8*scale,18*scale,16*scale,4*scale); else ctx.rect(cx-9*scale,cy-8*scale,18*scale,16*scale);
  ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(9*scale)+'px Courier New'; ctx.textAlign='center';
  ctx.fillText(String(number), cx, cy+3*scale);
  ctx.fillStyle=helmetColor;
  ctx.beginPath(); ctx.arc(cx,cy-10*scale,6*scale,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=Math.max(1,scale);
  ctx.beginPath();
  if(facingUp){ ctx.moveTo(cx-4*scale,cy-9*scale); ctx.lineTo(cx-2*scale,cy-5*scale); }
  else { ctx.moveTo(cx-4*scale,cy-11*scale); ctx.lineTo(cx-2*scale,cy-15*scale); }
  ctx.stroke();
  ctx.restore();
}

function drawFootball(cx,cy,scale){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle='#6b3b17';
  ctx.beginPath(); ctx.ellipse(0,0,9*scale,5.5*scale,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(-4*scale,0); ctx.lineTo(4*scale,0); ctx.stroke();
  for(let i=-3;i<=3;i+=2){ ctx.beginPath(); ctx.moveTo(i*scale,-1.5*scale); ctx.lineTo(i*scale,1.5*scale); ctx.stroke(); }
  ctx.restore();
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

let lastFrame = Date.now();
function loop(){
  const now = Date.now();
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  const w = canvas.width, h = canvas.height;

  ctx.save();
  if(screenShake > 0){
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    screenShake *= 0.85;
    if(screenShake < 0.3) screenShake = 0;
  }

  drawField(w,h);

  const offenseJersey = possession==='user' ? '#1557b0' : '#b01515';
  const offenseHelmet = possession==='user' ? '#0c3a73' : '#6e0d0d';
  const defenseJersey = possession==='user' ? '#b01515' : '#1557b0';
  const defenseHelmet = possession==='user' ? '#6e0d0d' : '#0c3a73';

  if(phase === 'live-run'){
    let ax=0, ay=0;
    if(controlledByUser){
      ax = joy.x * ACCEL * dt; ay = joy.y * ACCEL * dt;
    } else {
      let repelX = 0;
      for(const d of defenders){
        const dist = Math.hypot(d.x-carrier.x, d.y-carrier.y);
        if(dist < 0.22) repelX += (carrier.x - d.x) / (dist+0.05);
      }
      const desiredX = clamp(repelX*0.3 + (cpuAimX-carrier.x)*0.6, -1, 1);
      ax = desiredX * ACCEL * dt;
      ay = -1 * ACCEL * dt;
    }
    carrier.vx = clamp(carrier.vx + ax, -MAXSPD, MAXSPD);
    carrier.vy = clamp(carrier.vy + ay, -MAXSPD, MAXSPD);
    if(Math.abs(ax) < 1e-9) carrier.vx *= FRICTION;
    if(Math.abs(ay) < 1e-9) carrier.vy *= FRICTION;
    carrier.x = clamp(carrier.x + carrier.vx*dt, 0.03, 0.97);
    carrier.y = clamp(carrier.y + carrier.vy*dt, 0.04, 0.95);

    for(const b of blockers){
      for(const d of defenders){
        if(Math.hypot(d.x-b.x,d.y-b.y) < 0.09 && d.y > b.y-0.05){ b.engagedUntil = now + 450; }
      }
    }

    for(const d of defenders){
      const blocked = blockers.some(b => now < b.engagedUntil && Math.hypot(d.x-b.x,d.y-b.y) < 0.09);
      const dx = carrier.x-d.x, dy = carrier.y-d.y;
      const mag = Math.hypot(dx,dy) || 1;
      const spd = blocked ? d.speed*0.25 : d.speed;
      d.vx = (dx/mag) * spd; d.vy = (dy/mag) * spd;
      d.x = clamp(d.x + d.vx*dt, 0.02, 0.98);
      d.y = clamp(d.y + d.vy*dt, 0.03, 0.98);
    }

    for(const d of defenders){
      if(Math.hypot(d.x-carrier.x, d.y-carrier.y) < 0.045){
        const yardsGained = Math.round((0.78 - carrier.y) * 100);
        phase = 'result';
        tackledFor(yardsGained, controlledByUser);
        break;
      }
    }
    if(phase==='live-run' && carrier.y <= 0.055){
      phase='result';
      scoreTouchdown(controlledByUser);
    }
  }

  if(phase === 'live-pass'){
    passTimer += dt;
    if(controlledByUser){
      qb.x = clamp(qb.x + joy.x*ACCEL*dt*0.6, 0.3, 0.7);
      qb.y = clamp(qb.y + joy.y*ACCEL*dt*0.3, 0.68, 0.88);
    }
    for(const d of defenders.slice(0,3)){ d.y += dt*0.00006; }
    if(passTimer > passWindowMs){ phase='result'; sacked(controlledByUser); }
  }

  if(phase === 'ball-flight' && ballFlight){
    ballFlight.t++;
    const t = ballFlight.t/ballFlight.dur;
    if(t>=1){
      const nearestDef = ballFlight.openness;
      const catchChance = clamp(0.9 - (1/(nearestDef+0.3))*0.15, 0.2, 0.92);
      const intercepted = nearestDef < 0.22 && Math.random() < 0.25;
      const caught = !intercepted && Math.random() < catchChance;
      phase = 'result';
      if(caught){
        const yardsGain = Math.round((0.78 - ballFlight.toY) * 100);
        completePass(yardsGain, controlledByUser);
      } else {
        incomplete(intercepted, controlledByUser);
      }
      ballFlight = null;
    }
  }

  const sprites = [];
  if(phase==='live-run' || phase==='live-pass'){
    for(const b of blockers){ sprites.push({x:b.x*w, y:b.y, jersey:offenseJersey, helmet:offenseHelmet, num:60+Math.round(b.x*10), facingUp:true}); }
  }
  for(const d of defenders){ sprites.push({x:d.x*w, y:d.y, jersey:defenseJersey, helmet:defenseHelmet, num:90+Math.floor(d.x*10), facingUp:false}); }
  if(phase==='live-pass' || phase==='ball-flight'){
    for(const r of receivers){ sprites.push({x:r.x*w, y:r.y, jersey:offenseJersey, helmet:offenseHelmet, num:81, facingUp:true}); }
  }
  if(phase==='live-run' || phase==='result'){
    sprites.push({x:carrier.x*w, y:carrier.y, jersey:'#ffd400', helmet:'#8a6d00', num:22, facingUp:true});
  } else if(phase==='live-pass' || phase==='ball-flight'){
    sprites.push({x:qb.x*w, y:qb.y, jersey:'#ffd400', helmet:'#8a6d00', num:7, facingUp:true});
  }
  sprites.sort((a,b)=>a.y-b.y);
  for(const s of sprites){ drawPlayer(s.x, s.y*h, perspScale(s.y), s.jersey, s.helmet, s.num, s.facingUp); }

  if(ballFlight){
    const t = ballFlight.t/ballFlight.dur;
    const bx = w*(ballFlight.fromX + (ballFlight.toX-ballFlight.fromX)*t);
    const bYf = ballFlight.fromY + (ballFlight.toY-ballFlight.fromY)*t;
    const by = bYf*h - Math.sin(t*Math.PI)*30;
    drawFootball(bx, by, perspScale(bYf));
  }

  if(phase==='live-pass'){
    const pct = Math.max(0, 1 - passTimer/passWindowMs);
    ctx.fillStyle = pct>0.3 ? '#5f5' : '#f55';
    ctx.fillRect(w*0.1, h*0.03, w*0.8*pct, 6);
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
